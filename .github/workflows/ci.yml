name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # The whole suite runs with no physical TV: SSAP, Wake-on-LAN, delay and
      # key-store boundaries are all behind interfaces with fakes in CI.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  container-build:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards against a Dockerfile that drifts from the project layout — a
      # green `dotnet build` on the runner says nothing about the image.
      - name: Build image
        run: docker build -t webos-mcp:ci .
